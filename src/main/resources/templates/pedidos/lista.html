<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-4">ID</th>
                    <th>Cliente</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Responsável</th>
                    <th>Entrada</th>
                    <th>Saída</th>
                    <th>Status</th>
                    <th class="text-end pe-4" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="9" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                        Nenhum pedido encontrado.
                    </td>
                </tr>
                <tr th:each="pedido : ${pedidos}">
                    <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                    <td th:text="${nomesClientes.get(pedido.clienteId) ?: pedido.clienteId}"></td>
                    <td>
                        <div th:each="item : ${pedido.itens}"
                             th:text="${item.quantidade + '× ' + item.nomeProduto}"></div>
                    </td>
                    <td>
                        <span th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></span>
                        <span class="badge bg-info text-dark ms-1"
                              th:if="${pedido.descontoPercentual != null and pedido.descontoPercentual > 0}"
                              th:text="${'-' + #numbers.formatDecimal(pedido.descontoPercentual, 1, 2, 'COMMA') + '%'}"></span>
                    </td>
                    <td th:text="${pedido.responsavel}"></td>
                    <td th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                            <span th:if="${pedido.dataSaida != null}">
                                <span th:text="${#temporals.format(pedido.dataSaida, 'dd/MM/yyyy HH:mm')}"></span><br>
                                <small class="text-muted" th:text="${pedido.responsavelSaida}"></small>
                            </span>
                        <span th:if="${pedido.dataSaida == null}" class="text-muted">—</span>
                    </td>
                    <td>
                            <span class="badge"
                                  th:classappend="${pedido.status?.name() == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status?.name() == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status?.name() == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status?.descricao}">
                            </span>
                        <div class="small text-muted mt-1"
                             th:if="${pedido.status?.name() == 'CANCELADO'}"
                             th:text="${'Motivo: ' + pedido.justificativaCancelamento}"></div>
                    </td>
                    <td class="text-end pe-4" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <button type="button" class="btn btn-sm btn-outline-primary ms-1"
                                th:each="proximo : ${pedido.status?.proximosStatus()}"
                                th:text="${'→ ' + proximo.descricao}"
                                th:attr="data-pedido-id=${pedido.id}, data-status=${proximo.name()}"
                                onclick="mudarStatus(this)">
                        </button>

                        <span sec:authorize="hasRole('GERENTE')" th:if="${pedido.status?.antesDaSaida()}">
                                <button type="button" class="btn btn-sm btn-outline-success ms-1"
                                        th:attr="data-pedido-id=${pedido.id}"
                                        onclick="aplicarDesconto(this)">
                                    <i class="bi bi-percent"></i> Desconto
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-danger ms-1"
                                        th:attr="data-pedido-id=${pedido.id}"
                                        onclick="cancelarPedido(this)">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </button>
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        function cabecalhoCsrf() {
            const token = document.querySelector('meta[name="_csrf"]').content;
            const header = document.querySelector('meta[name="_csrf_header"]').content;
            return { [header]: token };
        }

        async function mudarStatus(botao) {
            const resposta = await fetch(
                `/api/pedidos/${botao.dataset.pedidoId}/status?status=${botao.dataset.status}`,
                { method: 'PUT', headers: cabecalhoCsrf() });

            if (resposta.ok) {
                Mensagem.aposRecarregar('Status do pedido atualizado.');
                window.location.reload();
            } else {
                Mensagem.mostrar(await lerMensagemErro(resposta, 'Erro ao atualizar o status.'), 'danger');
            }
        }

        function aplicarDesconto(botao) {
            Dialogo.abrir({
                titulo: 'Aplicar desconto',
                mensagem: 'O desconto substitui o anterior e é limitado a 20% do valor do pedido.',
                campo: { tipo: 'numero', rotulo: 'Porcentagem de desconto (%)', placeholder: '0 a 20' },
                confirmar: 'Aplicar desconto',
                aoConfirmar: async (valor) => {
                    const porcentagem = parseFloat(String(valor).replace(',', '.'));
                    if (isNaN(porcentagem)) return 'Informe uma porcentagem válida.';

                    const resposta = await fetch(`/api/pedidos/${botao.dataset.pedidoId}/desconto`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', ...cabecalhoCsrf() },
                        body: JSON.stringify({ porcentagem: porcentagem })
                    });
                    if (!resposta.ok) return lerMensagemErro(resposta, 'Erro ao aplicar o desconto.');

                    Mensagem.aposRecarregar('Desconto aplicado com sucesso.');
                    window.location.reload();
                    return null;
                }
            });
        }

        function cancelarPedido(botao) {
            Dialogo.abrir({
                titulo: 'Cancelar pedido',
                mensagem: 'O pedido continuará no histórico com status Cancelado e não poderá mais ser alterado.',
                campo: { tipo: 'texto', rotulo: 'Justificativa do cancelamento', placeholder: 'Descreva o motivo do cancelamento' },
                confirmar: 'Cancelar pedido',
                perigo: true,
                aoConfirmar: async (justificativa) => {
                    if (!justificativa || !justificativa.trim()) {
                        return 'A justificativa do cancelamento é obrigatória.';
                    }

                    const resposta = await fetch(`/api/pedidos/${botao.dataset.pedidoId}/cancelar`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', ...cabecalhoCsrf() },
                        body: JSON.stringify({ justificativa: justificativa })
                    });
                    if (!resposta.ok) return lerMensagemErro(resposta, 'Erro ao cancelar o pedido.');

                    Mensagem.aposRecarregar('Pedido cancelado.');
                    window.location.reload();
                    return null;
                }
            });
        }
    </script>

</div>

</body>
</html>
